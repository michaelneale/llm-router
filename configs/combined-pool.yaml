# Verified-trace router pool, remapped for a Claude Opus 4.8 frontier baseline.
#
# The checkpoint was trained from public verified multi-model success matrices,
# then mapped onto the callable Anthropic/OpenAI models below:
# - RouterBench: broad Q&A / coding / reasoning correctness over many source LLMs.
# - SWE-bench trajectories: code-fixing tasks with verified resolved labels.
# - terminal-bench trajectories: terminal / ops tasks with verified reward labels.
#
# Important: `name` is the checkpoint slot and must not change without retraining.
# `display_name` / `litellm_model` are the current provider models we serve in
# that slot. This aggressive pool uses Claude Opus 4.8 as the frontier/top
# escalation slot, caps the high automatic slot at GPT-5.4 Mini, and uses GPT
# mini/nano variants plus a GPT-5.4 Mini cap before Sonnet. The current trial
# tolerance is 0.145: a high-savings local replay point with about 3.9pp public
# verified-label loss. Use ROUTER_TOLERANCE or scripts/select_router_operating_point.py
# for sweeps.
routing:
  method: prefill
  checkpoint: checkpoints/prefill_router_combined.pt
  tolerance: 0.145
  output_token_weight: 0.25
  encoder: Qwen/Qwen3.5-0.8B
  encoder_backend: transformers

# Explicit guardrail: keep the learned router in charge unless the user forces
# the frontier tier with !hard.
escalation:
  top_tier_model: claude-opus-4-6-high
  force_top_tier_when_prompt_matches:
    - "(^|\\s)!hard\\b"

session_health:
  enabled: true
  checkpoint: checkpoints/session_health_public.pkl
  threshold: 0.88
  top_tier_model: claude-opus-4-6-high

# Cold-session utility overlay: route obviously-simple requests to the cheapest
# callable model instead of spending a classifier high-tier pick. Once a session
# has an incumbent model, cache-preserving pin/switch logic is allowed to govern.
utility:
  cheap_when_prompt_matches:
    - "^\\s*(hi|hello|hey|thanks|thank you)\\s*[!.?]*\\s*$"
    - "^\\s*(list|show)\\s+(the\\s+)?files\\b"
    - "^\\s*(ls|pwd|whoami|date)\\b\\s*$"
    - "^\\s*what\\s+does\\s+(ls|pwd|whoami|date)\\s+do\\??\\s*$"

# Cache-aware asymmetric switching: escalate readily (cheap cache to abandon),
# resist de-escalating off a warm-cached dearer model — more so the bigger the
# cached context. Keeps the prompt cache alive on big-context agent sessions.
switching:
  enabled: true
  up_margin: 0.0
  down_margin: 0.06
  down_margin_per_100k: 0.04
  max_down_margin: 0.25
  cache_pin_mode: "off"
  cache_pin_min_blend: 3.0

models:
  - name: nemotron-3-nano-reasoning
    display_name: GPT-5 Nano
    litellm_model: openai/gpt-5-nano
    cost_per_m_input_tokens: 0.05
    cost_per_m_output_tokens: 0.40
  - name: gpt-oss-20b-high
    display_name: GPT-5 Mini
    litellm_model: openai/gpt-5-mini
    cost_per_m_input_tokens: 0.25
    cost_per_m_output_tokens: 2.00
  - name: gpt-4-1-nano-high
    display_name: GPT-5 Mini
    litellm_model: openai/gpt-5-mini
    cost_per_m_input_tokens: 0.25
    cost_per_m_output_tokens: 2.00
  - name: gpt-oss-120b-high
    display_name: GPT-5.4 Mini
    litellm_model: openai/gpt-5.4-mini
    cost_per_m_input_tokens: 0.75
    cost_per_m_output_tokens: 4.50
  - name: gpt-4-1-mini-high
    display_name: GPT-5.4 Mini
    litellm_model: openai/gpt-5.4-mini
    cost_per_m_input_tokens: 0.75
    cost_per_m_output_tokens: 4.50
  - name: claude-sonnet-4-6-high
    display_name: Claude Sonnet 4.6
    litellm_model: anthropic/claude-sonnet-4-6
    cost_per_m_input_tokens: 3.00
    cost_per_m_output_tokens: 15.00
  - name: claude-haiku-4-5-high
    display_name: GPT-5.4 Mini Cap
    litellm_model: openai/gpt-5.4-mini
    cost_per_m_input_tokens: 0.75
    cost_per_m_output_tokens: 4.50
  - name: claude-opus-4-6-high
    display_name: Claude Opus 4.8
    litellm_model: anthropic/claude-opus-4-8
    cost_per_m_input_tokens: 5.00
    cost_per_m_output_tokens: 25.00
