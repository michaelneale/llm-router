# Combined router pool: trained on verified multi-model success across two domains
# - SWE-bench Verified (code-fixing) + terminal-bench (command-line / ops tasks).
# Held-out result (89 unseen tasks): router @ tol=0.05 resolves ~79% at ~$8/M,
# beating every fixed model including always-Opus (75%) at a fraction of the cost.
# See docs/LAB_NOTE.md. Slot names match the trained checkpoint; litellm_model is
# the callable model each slot serves (OpenAI + Anthropic, both keyed locally).
routing:
  method: prefill
  checkpoint: checkpoints/prefill_router_combined.pt
  tolerance: 0.05
  encoder: Qwen/Qwen3.5-0.8B
  encoder_backend: transformers

# Cache-aware asymmetric switching: escalate readily (cheap cache to abandon),
# resist de-escalating off a warm-cached dearer model — more so the bigger the
# cached context. Keeps the prompt cache alive on big-context agent sessions.
switching:
  enabled: true
  up_margin: 0.0
  down_margin: 0.06
  down_margin_per_100k: 0.04
  max_down_margin: 0.25

models:
  - name: nemotron-3-nano-reasoning
    display_name: GPT-5 Nano
    litellm_model: openai/gpt-5-nano
    cost_per_m_input_tokens: 0.05
    cost_per_m_output_tokens: 0.40
  - name: gpt-oss-20b-high
    display_name: GPT-4.1 Nano
    litellm_model: openai/gpt-4.1-nano
    cost_per_m_input_tokens: 0.10
    cost_per_m_output_tokens: 0.40
  - name: gpt-4-1-nano-high
    display_name: GPT-4.1 Mini
    litellm_model: openai/gpt-4.1-mini
    cost_per_m_input_tokens: 0.40
    cost_per_m_output_tokens: 1.60
  - name: gpt-oss-120b-high
    display_name: GPT-5 Mini
    litellm_model: openai/gpt-5-mini
    cost_per_m_input_tokens: 0.25
    cost_per_m_output_tokens: 2.00
  - name: gpt-4-1-mini-high
    display_name: Claude Haiku 4.5
    litellm_model: anthropic/claude-haiku-4-5
    cost_per_m_input_tokens: 1.00
    cost_per_m_output_tokens: 5.00
  - name: claude-sonnet-4-6-high
    display_name: Claude Sonnet 4.6
    litellm_model: anthropic/claude-sonnet-4-6
    cost_per_m_input_tokens: 3.00
    cost_per_m_output_tokens: 15.00
  - name: claude-haiku-4-5-high
    display_name: GPT-5.2
    litellm_model: openai/gpt-5.2
    cost_per_m_input_tokens: 5.00
    cost_per_m_output_tokens: 15.00
  - name: claude-opus-4-6-high
    display_name: Claude Opus 4.8
    litellm_model: anthropic/claude-opus-4-8
    cost_per_m_input_tokens: 5.00
    cost_per_m_output_tokens: 25.00
